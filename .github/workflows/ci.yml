name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.98.0 fmt --check
      - run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.98.0 test --workspace --all-features --locked
      - run: cargo +1.98.0 build --workspace --all-features --locked
