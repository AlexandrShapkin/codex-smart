name: Autodev Sandbox Smoke
on:
  pull_request:
    paths:
      - 'scripts/autodev_supervisor.py'
      - 'scripts/autodev_bwrap_smoke.py'
      - '.github/workflows/autodev-sandbox-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bubblewrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install distro bubblewrap in disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils cargo rustc gcc
      - name: Install only distro-provided bwrap AppArmor userns profile
        run: |
          # Ubuntu 24.04 restricts bwrap user namespaces by default.
          # Do NOT disable kernel.apparmor_restrict_unprivileged_userns.
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -r "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Test genuine read-only, networkless kernel namespace
        run: python3 -B scripts/autodev_bwrap_smoke.py
