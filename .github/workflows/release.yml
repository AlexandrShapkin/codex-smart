name: Release readiness
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.98.0 fmt --check
      - run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.98.0 test --workspace --all-features --locked
      - run: cargo +1.98.0 build --release --locked -p codex-smart-cli
      - run: tar -czf codex-smart-linux-x86_64.tar.gz -C target/release codex-smart && sha256sum codex-smart-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-smart-linux-x86_64
          path: |
            codex-smart-linux-x86_64.tar.gz
            SHA256SUMS
