name: Release readiness
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-just
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - run: just check
      - run: cargo +1.98.0 build --release --locked -p codex-smart-cli
      - run: tar -czf codex-smart-linux-x86_64.tar.gz -C target/release codex-smart && sha256sum codex-smart-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-smart-linux-x86_64
          path: |
            codex-smart-linux-x86_64.tar.gz
            SHA256SUMS
