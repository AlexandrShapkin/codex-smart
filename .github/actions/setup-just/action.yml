name: Pinned just
description: Install checksum-verified just 1.58.0 on a Linux x86_64 CI runner
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/just.tar.gz" https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
        printf '4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  %s\n' "$RUNNER_TEMP/just.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
        mkdir -p "$RUNNER_TEMP/codex-smart-bin"
        install -m 755 "$RUNNER_TEMP/just" "$RUNNER_TEMP/codex-smart-bin/just"
        printf '%s\n' "$RUNNER_TEMP/codex-smart-bin" >> "$GITHUB_PATH"
