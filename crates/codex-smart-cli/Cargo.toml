[package]
name = "codex-smart-cli"
default-run = "codex-smart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[[bin]]
name = "codex-smart"
path = "src/main.rs"
[[bin]]
name = "codex-smart-preparation-worker"
path = "src/preparation_worker.rs"
[dependencies]
codex-smart-core = { version = "=0.1.0", path = "../codex-smart-core" }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process", "thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
sha2 = { version = "=0.11.0", default-features = false }
codex-smart-process = { version = "=0.1.0", path = "../codex-smart-process" }
